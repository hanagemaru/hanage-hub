name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # リポジトリ変数 CLOUDFLARE_DEPLOY を true にするまでスキップされる。
    # Netlify から切り替える手順は docs/DEPLOY.md を参照。
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint
      # リポジトリ変数 CF_BEACON_TOKEN を設定すると Cloudflare Web Analytics のビーコンが入る。
      # 未設定ならビーコンは出力されない。
      # 同様に ADSENSE_CLIENT_ID を設定すると AdSense のスクリプトが入る。
      - run: npm run build
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          # Puttの新URLは公開・ランキング共用を確認済み。
          # Repository variable を false にすれば旧URLへ切り戻せる。
          NEXT_PUBLIC_PUTT_HUB_PLAY_ENABLED: ${{ vars.PUTT_HUB_PLAY_ENABLED || 'true' }}
          # Sweeper new URL is published; false restores the original link.
          NEXT_PUBLIC_SWEEPER_HUB_PLAY_ENABLED: ${{ vars.SWEEPER_HUB_PLAY_ENABLED || 'true' }}
          # The horse Worker + isolated D1 were deployed and fully verified on 2026-11-15.
          NEXT_PUBLIC_HORSE_PEDIGREE_PLAY_ENABLED: 'true'
      - name: Check published link target and sitemap at build time
        run: node scripts/verify-hub-play-flags.mjs both
      - name: Verify horse game release links before touching the live hub
        run: node scripts/verify-horse-hub-release.mjs
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy www → apex redirect on both published game paths
        run: npx --yes wrangler@4.148.0 deploy --config wrangler.game-www-redirect.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify new live hub links and scoped www redirect
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'https://hanage.app';
          async function retry(url, verify) {
            let last;
            for (let i = 0; i < 15; i++) {
              try {
                const response = await fetch(url, { redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(18000) });
                if (await verify(response)) return;
                last = `HTTP ${response.status} at ${url}`;
              } catch (error) { last = String(error); }
              await new Promise(resolve => setTimeout(resolve, 2500));
            }
            throw Error(`Post-deploy check failed: ${last}`);
          }
          await retry(origin + '/games/putt/', async response => {
            if (response.status !== 200) return false;
            const html = await response.text();
            const button = html.match(/<a\b[^>]*class="buttonPrimary"[^>]*>/);
            return !!button && button[0].includes('href="https://hanage.app/games/putt/play/"') &&
              button[0].includes('target="_blank"');
          });
          await retry(origin + '/sitemap.xml', async response =>
            response.status === 200 && (await response.text()).includes('https://hanage.app/games/putt/play/'));
          await retry('https://www.hanage.app/games/putt/play/', async response =>
            response.status === 302 && response.headers.get('location') === 'https://hanage.app/games/putt/play/');
          await retry('https://putt.hanage.app/', async response => response.status === 200);
          await retry(origin + '/games/multicolor-sweeper/', async response => {
            if (response.status !== 200) return false;
            const html = await response.text();
            const button = html.match(/<a\b[^>]*class="buttonPrimary"[^>]*>/);
            return !!button && button[0].includes('href="https://hanage.app/games/multicolor-sweeper/play/"') &&
              button[0].includes('target="_blank"');
          });
          await retry('https://www.hanage.app/games/multicolor-sweeper/play/', async response =>
            response.status === 302 && response.headers.get('location') === 'https://hanage.app/games/multicolor-sweeper/play/');
          await retry('https://mcsweeper.hanage.app/', async response => response.status === 200);
          console.log('PASS: both games open new tabs, sitemap and www redirects work, old URLs remain playable');
          NODE
      - name: Verify live horse introduction, game link and public canonical paths
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://hanage.app';
          async function retry(url,valid){
           let failure='';
           for(let i=0;i<15;i++){
            try{
             const response=await fetch(url,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(18000)});
             if(await valid(response))return;
             failure='HTTP '+response.status+' '+url;
            }catch(e){failure=String(e);}
            await new Promise(r=>setTimeout(r,2500));
           }
           throw Error('Horse release smoke failed: '+failure);
          }
          for(const path of ['/games/horse-pedigree/','/en/games/horse-pedigree/']){
           await retry(origin+path,async res=>{
            if(!res.ok)return false;
            const html=await res.text();
            const button=html.match(/<a\\b[^>]*class="buttonPrimary"[^>]*>/);
            return !!button&&button[0].includes('href="https://hanage.app/games/horse-pedigree/play/"')&&button[0].includes('target="_blank"');
           });
          }
          for(const path of ['/games/horse-pedigree/how-to-play/','/en/games/horse-pedigree/how-to-play/'])
           await retry(origin+path,async res=>res.ok);
          await retry(origin+'/games/',async res=>res.ok&&(await res.text()).includes('horse-pedigree'));
          await retry(origin+'/sitemap.xml',async res=>res.ok&&(await res.text()).includes(origin+'/games/horse-pedigree/play/'));
          await retry('https://www.hanage.app/games/horse-pedigree/play/',async res=>
           res.status===302&&res.headers.get('location')==='https://hanage.app/games/horse-pedigree/play/');
          await retry(origin+'/games/horse-pedigree/play/api/health',async res=>res.ok&&(await res.json()).ok===true);
          console.log('HORSE_HUB_LIVE_RELEASE_SUCCESS: Japanese/English landing/how-to, catalog, game URL, sitemap, www redirect, D1 API');
          NODE
      # リポジトリ変数 HUB_SMOKE_URL を設定すると、公開URLの生存確認を行う。
      - name: Smoke test
        if: vars.HUB_SMOKE_URL != ''
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.HUB_SMOKE_URL;
          const response = await fetch(url);
          const body = await response.text();
          if (!response.ok) throw new Error(`${url} returned ${response.status}`);
          if (!body.includes('hanage.app')) throw new Error(`${url} did not return the hub page`);
          console.log(`Smoke test passed: ${url}`);
          NODE
        env:
          HUB_SMOKE_URL: ${{ vars.HUB_SMOKE_URL }}
