name: Publish horse-pedigree game only (Worker + isolated D1)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-horse-pedigree.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-horse-pedigree-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'hanagemaru/hanage-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout hub deployment tooling
        uses: actions/checkout@v4
      - name: Checkout reviewed horse game (pinned merged main commit)
        uses: actions/checkout@v4
        with:
          repository: hanagemaru/-family-tree-game
          ref: 85d6b411c402dd3a03f8224bdd99f7c969b1eb6b
          path: game
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build horse game assets (independent of hub / other games)
        working-directory: game
        run: npm run build
      - name: Check merged UI files before deploying
        working-directory: game
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('dist/index.html','utf8');
          const home=readFileSync('dist/home-screen.css','utf8');
          const app=readFileSync('dist/src/app.js','utf8');
          assert.match(html,/href="\.\/home-screen\.css"/);
          assert.match(html,/class="home-menu-button"/);
          assert.ok(!html.includes('class="text-button help-nav"'),'duplicate header Help control found');
          assert.match(home,/color:#F7FAFC/);
          assert.match(app,/layoutFamily\(state,\{minimizeCrossings:true\}\)/);
          const profile=JSON.parse(readFileSync('dist/data/horse-profiles.v1.json','utf8'));
          assert.equal(profile.coverage.withProfileFacts,808);
          assert.equal(profile.coverage.named,872);
          assert.match(app,/pinchCamera\(/);
          assert.match(app,/if\(dialogKind==='horse-profile'\)\{closeDialog\(\);return;\}/);
          assert.match(html,/href="\.\/horse-profile\.css"/);
          console.log('HORSE_PRODUCTION_UI_BUILD_VERIFIED: 808 horse biographies, tap anywhere, stable pinch, old UI intact');
          NODE
      - name: Provision ONLY horse-pedigree-ranking and bind its UUID locally
        run: node scripts/provision-horse-d1.mjs
      - name: Migrate dedicated D1 schema remotely (never touch Sweeper or Putt)
        working-directory: game
        run: npx --yes wrangler@4.148.0 d1 migrations apply horse-pedigree-ranking --remote --config wrangler.hub.jsonc
      - name: Deploy only two hanage.app/games/horse-pedigree/play routes
        working-directory: game
        run: npx --yes wrangler@4.148.0 deploy --config wrangler.hub.jsonc
      - name: Set a persistent production-only RANKING_SECRET if absent
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 secret list --name horse-pedigree-hub --format json > "$RUNNER_TEMP/horse-secrets.json"
          if node -e 'const a=require(process.argv[1]);if(!Array.isArray(a))process.exit(2);process.exit(a.some(x=>x.name==="RANKING_SECRET")?0:1)' "$RUNNER_TEMP/horse-secrets.json"; then
            echo "Existing production RANKING_SECRET kept unchanged"
          else
            node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("hex"))' |
              npx --yes wrangler@4.148.0 secret put RANKING_SECRET --config wrangler.hub.jsonc
            echo "New random RANKING_SECRET stored on horse-pedigree-hub only"
          fi
      - name: Verify the actual published game, D1 ranking, protection and deletion
        run: node scripts/verify-horse-live.mjs
      - name: Verify published redesign assets are the latest merged commit
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://hanage.app/games/horse-pedigree/play/';
          async function check(name,predicate){
           let reason='';
           for(let i=0;i<12;i++){
            try{
             const r=await fetch(root+name,{cache:'no-store',signal:AbortSignal.timeout(15000)});
             const body=await r.text();
             if(r.ok&&predicate(body))return;
             reason='status '+r.status+', verification false for '+name;
            }catch(e){reason=String(e);}
            await new Promise(resolve=>setTimeout(resolve,1800));
           }
           throw Error('New horse game assets were not published: '+reason);
          }
          await check('',s=>s.includes('href="./home-screen.css"')&&s.includes('class="home-menu-button"')&&!s.includes('text-button help-nav'));
          await check('home-screen.css',s=>s.includes('color:#F7FAFC')&&s.includes('.home-primary-button'));
          await check('src/app.js',s=>s.includes('minimizeCrossings:true')&&s.includes('home-menu-button')&&s.includes("if(dialogKind==='horse-profile'){closeDialog();return;}")&&s.includes('pinchCamera('));
          await check('horse-profile.css',s=>s.includes('dialog.horse-profile-dialog')&&s.includes('#modal-close{display:none!important}'));
          await check('data/horse-profiles.v1.json',s=>{
           try{const data=JSON.parse(s);return data.coverage.named===872&&data.coverage.withProfileFacts===808}catch{return false}
          });
          await check('api/health',s=>{try{return JSON.parse(s).ok===true}catch{return false}});
          for(const url of ['https://hanage.app/games/horse-pedigree/','https://hanage.app/games/putt/','https://hanage.app/games/multicolor-sweeper/']){
           const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(15000)});
           assert.equal(r.status,200,url+' must remain available');
          }
          console.log('HORSE_REDESIGN_LIVE_VERIFIED: new CSS, clean menu, minimized crossings, API, hub and two other games');
          NODE
