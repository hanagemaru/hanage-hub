name: Horse hub release build validation (no deploy)
on:
  push:
    branches: [feature/horse-pedigree-hub-20261115]
    paths: [.github/workflows/verify-horse-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint
      - name: Build all three published games' hub pages
        env:
          NEXT_PUBLIC_PUTT_HUB_PLAY_ENABLED: 'true'
          NEXT_PUBLIC_SWEEPER_HUB_PLAY_ENABLED: 'true'
          NEXT_PUBLIC_HORSE_PEDIGREE_PLAY_ENABLED: 'true'
        run: npm run build
      - name: Verify published horse landing/how-to, catalog, sitemap, game and tab URLs
        run: node scripts/verify-horse-hub-release.mjs
      - name: Verify previous games remain reachable via existing links
        run: node scripts/verify-hub-play-flags.mjs both
      - name: Verify new www route is narrow and retains existing games
        run: node --experimental-transform-types scripts/verify-game-www-redirect.mjs
      - name: Dry-run the path-scoped www redirect changes
        run: npx wrangler deploy --dry-run --config wrangler.game-www-redirect.jsonc --outdir /tmp/horse-www-route-dry-run
