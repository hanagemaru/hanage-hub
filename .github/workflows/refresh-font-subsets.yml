name: Refresh font subsets

on:
  push:
    branches:
      - feat/adsense-content-preview

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adsense-content-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - run: python -m pip install fonttools brotli
      - run: bash scripts/build-fonts.sh
      - name: Commit refreshed subsets
        run: |
          if git diff --quiet -- public/fonts; then
            echo "Font subsets are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts
          git commit -m "本文追加に合わせてフォントサブセットを更新"
          git push origin HEAD:feat/adsense-content-preview
